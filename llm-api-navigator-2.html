*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); line-height: 1.5; }

.topnav .brand {

}

}
.search-box { max-width: 560px; margin: 0 auto; position: relative; }
.search-box input {

}
.search-box input::placeholder { color: oklch(70% 0.01 60); }
.search-box input:focus { border-color: var(--accent); }
.search-box .icon {

.stats-row {

.stats-row .stat-item { text-align: center; }

.layout {

@media (max-width: 860px) {

.sidebar {

.sidebar .filter-group { margin-bottom: 24px; }
.sidebar .filter-item {

.sidebar .filter-item:hover { color: var(--accent); }

.main { padding: 24px; }
.toolbar {

.toolbar .result-count { font-size: 13px; color: var(--muted); margin-inline-end: auto; }

.sort-btn {

.chip-row { display: none; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }

.chip {

.chip:hover, .chip.active { border-color: var(--accent); color: var(--accent); }
.card-grid {

.modal-rating-detail { display: flex; align-items: baseline; gap: 8px; }

.site-footer {

.site-footer a:hover { text-decoration: underline; }
</style>
</head>

  const grid = document.getElementById('cardGrid'), list = getFilteredProviders();
  document.getElementById('resultCount').innerHTML = `共 <strong>${list.length}</strong> 家商家`;
  grid.innerHTML = list.map(p => `<div class="provider-card" onclick="openModal('${p.id}')"><div class="card-top"><div class="card-logo" style="background:${p.color}">${p.name[0]}</div><div class="card-name">${p.name}</div><div class="card-rating"><span class="stars">${renderStars(p.rating)}</span>${p.rating}</div></div><div class="card-desc">${p.desc}</div><div class="card-tags">${p.brands.slice(0, 4).map(b => `<span class="tag">${b}</span>`).join('')}${p.brands.length > 4 ? `<span class="tag highlight">+${p.brands.length - 4}</span>` : ''}</div><div class="card-bottom"><span class="card-meta"><span class="status-dot ${p.status}"></span>${p.uptime !== '—' ? p.uptime + ' 可用' : '自建'}</span><span class="card-meta" style="margin-inline-start:auto">${p.reviews.toLocaleString()} 条评价</span></div></div>`).join('');
}
function renderSidebar() {
  document.getElementById('categoryFilters').innerHTML = categories.map(c => { const n = c === '全部' ? providers.length : providers.filter(p => p.category === c).length; return `<div class="filter-item ${activeCategory === c ? 'active' : ''}" onclick="setCategory('${c}')">${c} <span class="count">${n}</span></div>`; }).join('');
  document.getElementById('brandFilters').innerHTML = brandOptions.map(b => { const n = providers.filter(p => p.brands.includes(b)).length; return `<label class="filter-item ${activeBrand === b ? 'active' : ''}"><input type="checkbox" ${activeBrand === b ? 'checked' : ''} onchange="toggleBrand('${b}')" />${b} <span class="count">${n}</span></label>`; }).join('');
  document.getElementById('ratingFilters').innerHTML = ratingOptions.map((r, i) => `<div class="filter-item ${activeRating === i ? 'active' : ''}" onclick="setRating(${i})">${r}</div>`).join('');
  document.getElementById('chipRow').innerHTML = categories.map(c => `<span class="chip ${activeCategory === c ? 'active' : ''}" onclick="setCategory('${c}')">${c}</span>`).join('');
}
function openModal(id) {
  const p = providers.find(x => x.id === id); if (!p) return;
  document.getElementById('modalContent').innerHTML = `<div class="modal-header"><div class="card-logo" style="background:${p.color}">${p.name[0]}</div><h2>${p.name}</h2><button class="modal-close" onclick="closeModal()" aria-label="关闭">&times;</button></div><div class="modal-body"><div class="modal-section"><div class="modal-rating-detail"><span class="big-score">${p.rating}</span><span style="color:var(--accent);font-size:14px;">${renderStars(p.rating)}</span><span class="review-count">${p.reviews.toLocaleString()} 条评价</span></div></div><div class="modal-section"><p class="modal-desc">${p.desc}</p></div><div class="modal-section"><h4>关键数据</h4><div class="modal-stats"><div class="modal-stat"><span class="val">${p.brands.length}</span><span class="label">支持品牌</span></div><div class="modal-stat"><span class="val">${p.uptime}</span><span class="label">可用率</span></div><div class="modal-stat"><span class="val">${p.speed}</span><span class="label">首 token 延迟</span></div></div></div><div class="modal-section"><h4>支持品牌</h4><div class="modal-models">${p.brands.map(b => `<span class="tag">${b}</span>`).join('')}</div></div><div class="modal-section"><h4>核心特性</h4><ul class="modal-features">${p.features.map(f => `<li>${f}</li>`).join('')}</ul></div><div class="modal-section"><a href="${p.url}" class="modal-cta">访问官网</a></div></div>`;
  document.getElementById('modalOverlay').classList.add('open'); document.body.style.overflow = 'hidden';
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); document.body.style.overflow = ''; }
function setCategory(c) { activeCategory = c; renderSidebar(); renderCards(); }
function toggleBrand(b) { activeBrand = activeBrand === b ? null : b; renderSidebar(); renderCards(); }
function setRating(i) { activeRating = i; renderSidebar(); renderCards(); }
document.querySelectorAll('.sort-btn').forEach(btn => { btn.addEventListener('click', () => { document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); currentSort = btn.dataset.sort; renderCards(); }); });
document.getElementById('searchInput').addEventListener('input', e => { searchQuery = e.target.value.trim(); renderCards(); });
document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
(function init() { const allBrands = new Set(); providers.forEach(p => p.brands.forEach(b => allBrands.add(b))); document.getElementById('statProviders').textContent = providers.length; document.getElementById('statBrands').textContent = allBrands.size; document.getElementById('statReviews').textContent = providers.reduce((s, p) => s + p.reviews, 0).toLocaleString(); renderSidebar(); renderCards(); })();
</script>
</body>
</html>
