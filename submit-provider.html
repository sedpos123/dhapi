
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>提交商家 — 中转导航</title>
<style>
:root {
  --bg:      oklch(97% 0.012 80);
  --surface: oklch(99% 0.005 80);
  --fg:      oklch(20% 0.02 60);
  --muted:   oklch(48% 0.015 60);
  --border:  oklch(89% 0.012 80);
  --accent:  oklch(58% 0.16 35);
  --success: oklch(62% 0.17 145);
  --warn:    oklch(75% 0.16 85);
  --danger:  oklch(55% 0.2 25);
  --font-display: 'Iowan Old Style', 'Charter', Georgia, serif;
  --font-body:    -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono:    ui-monospace, 'JetBrains Mono', Menlo, monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); line-height: 1.5; }
.topnav {
  position: sticky; top: 0; z-index: 100;
  background: oklch(97% 0.012 80 / 0.92);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px; height: 56px;
  display: flex; align-items: center; gap: 24px;
}
.topnav .brand {
  font-family: var(--font-display); font-size: 20px; font-weight: 600;
  letter-spacing: -0.01em; color: var(--fg); white-space: nowrap; text-decoration: none;
}
.topnav .brand span { color: var(--accent); }
.topnav .nav-links { display: flex; gap: 20px; margin-inline-start: auto; }
.topnav .nav-links a {
  font-size: 13px; color: var(--muted); text-decoration: none;
  letter-spacing: 0.02em; transition: color .15s;
}
.topnav .nav-links a:hover { color: var(--fg); }
.topnav .nav-links a.current { color: var(--accent); font-weight: 500; }
.page-header {
  padding: 40px 24px 32px; text-align: center;
  border-bottom: 1px solid var(--border);
}
.page-header h1 {
  font-family: var(--font-display); font-size: clamp(28px, 4vw, 40px);
  line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 10px;
}
.page-header .subtitle {
  font-size: 15px; color: var(--muted); max-width: 440px; margin: 0 auto;
  line-height: 1.6;
}
.form-container { max-width: 680px; margin: 0 auto; padding: 32px 24px 64px; }
.form-section { margin-bottom: 36px; }
.form-section-title {
  font-family: var(--font-mono); font-size: 11px; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--muted); margin-bottom: 16px;
  font-weight: 500; padding-bottom: 8px; border-bottom: 1px solid var(--border);
}
.form-row { margin-bottom: 20px; }
.form-row:last-child { margin-bottom: 0; }
.form-label {
  display: block; font-size: 13px; font-weight: 500;
  margin-bottom: 6px; color: var(--fg);
}
.form-label .required { color: var(--accent); margin-inline-start: 2px; }
.form-label .hint { font-weight: 400; color: var(--muted); font-size: 12px; margin-inline-start: 8px; }
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 10px 14px; font-size: 14px;
  font-family: var(--font-body); color: var(--fg);
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--surface); outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px oklch(58% 0.16 35 / 0.1);
}
.form-input::placeholder, .form-textarea::placeholder { color: oklch(65% 0.01 60); }
.form-textarea { resize: vertical; min-height: 100px; line-height: 1.6; }
.form-select {
  cursor: pointer; appearance: none;
  background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%23787878' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat; background-position: right 14px center;
  padding-inline-end: 36px;
}
.form-row-inline { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 540px) { .form-row-inline { grid-template-columns: 1fr; } }
.logo-upload-area { display: flex; align-items: flex-start; gap: 20px; }
.logo-dropzone {
  width: 96px; height: 96px; border: 2px dashed var(--border);
  border-radius: 12px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px;
  cursor: pointer; transition: border-color .15s, background .15s;
  background: var(--surface); flex-shrink: 0; position: relative; overflow: hidden;
}
.logo-dropzone:hover { border-color: var(--accent); background: oklch(97% 0.02 35 / 0.3); }
.logo-dropzone.has-image { border-style: solid; border-color: var(--accent); }
.logo-dropzone .dropzone-icon { font-size: 24px; color: var(--muted); line-height: 1; }
.logo-dropzone .dropzone-text { font-size: 10px; color: var(--muted); text-align: center; line-height: 1.3; }
.logo-dropzone img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
.logo-upload-hint { font-size: 12px; color: var(--muted); line-height: 1.6; padding-top: 8px; }
.logo-upload-hint strong { color: var(--fg); font-weight: 500; }
.model-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.model-check {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--surface); cursor: pointer;
  transition: border-color .15s, background .15s; user-select: none;
}
.model-check:hover { border-color: oklch(70% 0.06 80); }
.model-check.checked { border-color: var(--accent); background: oklch(95% 0.04 35 / 0.15); }
.model-check input { display: none; }
.model-check .check-box {
  width: 16px; height: 16px; border: 1.5px solid var(--border);
  border-radius: 3px; display: flex; align-items: center; justify-content: center;
  transition: all .15s; flex-shrink: 0; font-size: 10px;
}
.model-check.checked .check-box { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.model-check .model-name { font-size: 13px; }
.custom-model-row { display: flex; gap: 8px; margin-top: 10px; }
.custom-model-row .form-input { flex: 1; }
.btn-add-model {
  padding: 10px 16px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; color: var(--muted); font-size: 13px; cursor: pointer;
  transition: all .15s; font-family: var(--font-body); white-space: nowrap;
}
.btn-add-model:hover { border-color: var(--accent); color: var(--accent); }
.feature-input-row { display: flex; gap: 8px; }
.feature-input-row .form-input { flex: 1; }
.btn-add-feature {
  padding: 10px 16px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; color: var(--muted); font-size: 13px; cursor: pointer;
  transition: all .15s; font-family: var(--font-body); white-space: nowrap;
}
.btn-add-feature:hover { border-color: var(--accent); color: var(--accent); }
.feature-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.feature-tag {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; padding: 4px 10px; border-radius: 4px;
  background: oklch(97% 0.01 80); border: 1px solid var(--border);
  color: var(--fg); font-family: var(--font-mono); letter-spacing: 0.01em;
}
.feature-tag .remove-feature { cursor: pointer; color: var(--muted); font-size: 14px; line-height: 1; transition: color .15s; }
.feature-tag .remove-feature:hover { color: var(--danger); }
.submit-row {
  display: flex; align-items: center; gap: 16px; margin-top: 40px;
  padding-top: 24px; border-top: 1px solid var(--border);
}
.btn-submit {
  padding: 12px 32px; background: var(--accent); color: var(--surface);
  border: none; border-radius: 6px; font-size: 15px; font-weight: 500;
  cursor: pointer; font-family: var(--font-body); transition: opacity .15s;
}
.btn-submit:hover { opacity: 0.88; }
.submit-note { font-size: 12px; color: var(--muted); line-height: 1.5; }
.btn-back {
  padding: 12px 24px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; color: var(--muted); font-size: 14px; cursor: pointer;
  font-family: var(--font-body); text-decoration: none; transition: all .15s;
}
.btn-back:hover { border-color: var(--fg); color: var(--fg); }
.success-view { display: none; text-align: center; padding: 80px 24px; }
.success-view.show { display: block; }
.success-view .check-icon {
  width: 64px; height: 64px; border-radius: 50%;
  background: oklch(95% 0.05 145); color: var(--success);
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; margin: 0 auto 20px;
}
.success-view h2 {
  font-family: var(--font-display); font-size: 28px; font-weight: 600;
  letter-spacing: -0.02em; margin-bottom: 10px;
}
.success-view p { font-size: 15px; color: var(--muted); max-width: 400px; margin: 0 auto 28px; line-height: 1.6; }
.success-view .btn-back { display: inline-block; }
.form-view.hide { display: none; }
.site-footer { border-top: 1px solid var(--border); padding: 24px; text-align: center; font-size: 12px; color: var(--muted); margin-top: 48px; }
</style>
</head>
<body>
<nav class="topnav">
  <a href="index.html" class="brand">中转<span>导航</span></a>
  <div class="nav-links">
    <a href="index.html">首页</a>
    <a href="#">对比</a>
    <a href="submit.html" class="current">提交商家</a>
  </div>
</nav>
<header class="page-header">
  <h1>提交你的商家信息</h1>
  <p class="subtitle">免费收录，无需登录。填写以下信息，审核通过后即可展示在导航站。</p>
</header>
<div class="form-container">
  <div class="form-view" id="formView">
    <form id="submitForm" novalidate>
      <div class="form-section">
        <div class="form-section-title">基本信息</div>
        <div class="form-row">
          <label class="form-label">商家 LOGO<span class="required">*</span></label>
          <div class="logo-upload-area">
            <div class="logo-dropzone" id="logoDropzone" tabindex="0" role="button" aria-label="上传 LOGO">
              <span class="dropzone-icon">⤴</span>
              <span class="dropzone-text">上传图片</span>
            </div>
            <input type="file" id="logoInput" accept="image/*" hidden />
            <div class="logo-upload-hint">
              <strong>支持 PNG / JPG / SVG</strong><br />建议正方形，至少 200×200px<br />将作为卡片和详情页的展示图标
            </div>
          </div>
        </div>
        <div class="form-row">
          <label class="form-label" for="providerName">商家名称<span class="required">*</span></label>
          <input class="form-input" type="text" id="providerName" placeholder="例如：API2D" required />
        </div>
        <div class="form-row-inline">
          <div class="form-row">
            <label class="form-label" for="providerUrl">网站链接<span class="required">*</span></label>
            <input class="form-input" type="url" id="providerUrl" placeholder="https://example.com" required />
          </div>
          <div class="form-row">
            <label class="form-label" for="providerCategory">分类<span class="required">*</span></label>
            <select class="form-select" id="providerCategory" required>
              <option value="">请选择分类</option>
              <option value="综合中转">综合中转</option>
              <option value="专注 OpenAI">专注 OpenAI</option>
              <option value="专注 Claude">专注 Claude</option>
              <option value="国产模型">国产模型</option>
              <option value="多模型聚合">多模型聚合</option>
              <option value="开源方案">开源方案</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <label class="form-label" for="providerDesc">商家简介<span class="required">*</span><span class="hint">一句话说明你的核心卖点</span></label>
          <textarea class="form-textarea" id="providerDesc" rows="3" placeholder="例如：老牌中转，支持 OpenAI 全系列 + Claude，国内直连，按量计费，余额不过期。" required></textarea>
        </div>
      </div>
      <div class="form-section">
        <div class="form-section-title">模型与定价</div>
        <div class="form-row">
          <label class="form-label">支持的模型<span class="required">*</span><span class="hint">勾选或自定义添加</span></label>
          <div class="model-grid" id="modelGrid"></div>
          <div class="custom-model-row">
            <input class="form-input" type="text" id="customModelInput" placeholder="输入自定义模型名称，如 GLM-4-Plus" />
            <button type="button" class="btn-add-model" id="btnAddModel">添加</button>
          </div>
        </div>
        <div class="form-row-inline">
          <div class="form-row">
            <label class="form-label" for="inputPrice">输入价格<span class="required">*</span><span class="hint">每百万 token</span></label>
            <input class="form-input" type="text" id="inputPrice" placeholder="例如：¥14" required />
          </div>
          <div class="form-row">
            <label class="form-label" for="outputPrice">输出价格<span class="hint">每百万 token，选填</span></label>
            <input class="form-input" type="text" id="outputPrice" placeholder="例如：¥28" />
          </div>
        </div>
      </div>
      <div class="form-section">
        <div class="form-section-title">核心特性与联系方式</div>
        <div class="form-row">
          <label class="form-label">核心特性<span class="hint">添加 3–5 个特色标签</span></label>
          <div class="feature-input-row">
            <input class="form-input" type="text" id="featureInput" placeholder="例如：国内直连免梯" />
            <button type="button" class="btn-add-feature" id="btnAddFeature">添加</button>
          </div>
          <div class="feature-tags" id="featureTags"></div>
        </div>
        <div class="form-row-inline">
          <div class="form-row">
            <label class="form-label" for="contactEmail">联系邮箱<span class="hint">用于审核通知</span></label>
            <input class="form-input" type="email" id="contactEmail" placeholder="admin@example.com" />
          </div>
          <div class="form-row">
            <label class="form-label" for="contactWechat">微信号<span class="hint">选填，方便沟通</span></label>
            <input class="form-input" type="text" id="contactWechat" placeholder="可选" />
          </div>
        </div>
        <div class="form-row">
          <label class="form-label" for="extraNote">补充说明<span class="hint">任何你想让我们知道的信息</span></label>
          <textarea class="form-textarea" id="extraNote" rows="3" placeholder="例如：我们有企业级 SLA，可以提供测试账号…"></textarea>
        </div>
      </div>
      <div class="submit-row">
        <button type="submit" class="btn-submit" id="btnSubmit">提交申请</button>
        <a href="index.html" class="btn-back">返回首页</a>
        <span class="submit-note">提交后 1–3 个工作日内完成审核</span>
      </div>
    </form>
  </div>
  <div class="success-view" id="successView">
    <div class="check-icon">✓</div>
    <h2>提交成功</h2>
    <p>感谢你的提交！我们会在 1–3 个工作日内完成审核，审核通过后将展示在导航站中。</p>
    <a href="index.html" class="btn-back">返回首页</a>
  </div>
</div>
<footer class="site-footer">中转导航 — 提交信息仅用于审核收录，不会用于其他用途。</footer>
<script>
const presetModels = ['GPT-4o','GPT-4-Turbo','GPT-4o-mini','o1','o1-mini','Claude-3.5-Sonnet','Claude-3-Opus','Claude-3-Haiku','DeepSeek-V3','DeepSeek-R1','Qwen-2.5','GLM-4','Gemini-Pro','Gemini-Flash','Llama-3','Mistral','Kimi-128K','Yi-Lightning','InternLM','CogView-3'];
const selectedModels = new Set();
const features = [];
const dropzone = document.getElementById('logoDropzone');
const logoInput = document.getElementById('logoInput');
dropzone.addEventListener('click', () => logoInput.click());
dropzone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); logoInput.click(); } });
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.style.borderColor = 'var(--accent)'; });
dropzone.addEventListener('dragleave', () => { dropzone.style.borderColor = ''; });
dropzone.addEventListener('drop', e => { e.preventDefault(); dropzone.style.borderColor = ''; if (e.dataTransfer.files.length) handleLogoFile(e.dataTransfer.files[0]); });
logoInput.addEventListener('change', () => { if (logoInput.files.length) handleLogoFile(logoInput.files[0]); });
function handleLogoFile(file) {
  if (!file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = e => { dropzone.innerHTML = '<img src="' + e.target.result + '" alt="LOGO 预览" />'; dropzone.classList.add('has-image'); };
  reader.readAsDataURL(file);
}
function renderModelGrid() {
  const grid = document.getElementById('modelGrid');
  grid.innerHTML = presetModels.map(m => {
    const checked = selectedModels.has(m);
    return '<label class="model-check ' + (checked ? 'checked' : '') + '" data-model="' + m + '"><input type="checkbox" ' + (checked ? 'checked' : '') + ' /><span class="check-box">' + (checked ? '✓' : '') + '</span><span class="model-name">' + m + '</span></label>';
  }).join('');
  grid.querySelectorAll('.model-check').forEach(el => {
    el.addEventListener('click', e => { e.preventDefault(); const m = el.dataset.model; if (selectedModels.has(m)) { selectedModels.delete(m); } else { selectedModels.add(m); } renderModelGrid(); });
  });
}
renderModelGrid();
document.getElementById('btnAddModel').addEventListener('click', addCustomModel);
document.getElementById('customModelInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addCustomModel(); } });
function addCustomModel() { const input = document.getElementById('customModelInput'); const val = input.value.trim(); if (!val) return; if (!presetModels.includes(val)) presetModels.push(val); selectedModels.add(val); input.value = ''; renderModelGrid(); }
document.getElementById('btnAddFeature').addEventListener('click', addFeature);
document.getElementById('featureInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addFeature(); } });
function addFeature() { const input = document.getElementById('featureInput'); const val = input.value.trim(); if (!val || features.includes(val)) { input.value = ''; return; } if (features.length >= 6) return; features.push(val); input.value = ''; renderFeatures(); }
function removeFeature(idx) { features.splice(idx, 1); renderFeatures(); }
function renderFeatures() { const el = document.getElementById('featureTags'); el.innerHTML = features.map((f, i) => '<span class="feature-tag">' + f + '<span class="remove-feature" onclick="removeFeature(' + i + ')">×</span></span>').join(''); }
document.getElementById('submitForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = document.getElementById('providerName').value.trim();
  const url = document.getElementById('providerUrl').value.trim();
  const category = document.getElementById('providerCategory').value;
  const desc = document.getElementById('providerDesc').value.trim();
  const inputPrice = document.getElementById('inputPrice').value.trim();
  if (!name || !url || !category || !desc || !inputPrice) { highlightEmpty(); return; }
  if (selectedModels.size === 0) { document.getElementById('modelGrid').style.outline = '2px solid var(--danger)'; document.getElementById('modelGrid').scrollIntoView({ behavior: 'smooth', block: 'center' }); setTimeout(() => { document.getElementById('modelGrid').style.outline = ''; }, 2000); return; }
  document.getElementById('formView').classList.add('hide'); document.getElementById('successView').classList.add('show'); window.scrollTo({ top: 0, behavior: 'smooth' });
});
function highlightEmpty() {
  ['providerName','providerUrl','providerCategory','providerDesc','inputPrice'].forEach(id => {
    const el = document.getElementById(id); if (!el.value.trim()) { el.style.borderColor = 'var(--danger)'; el.addEventListener('input', function handler() { el.style.borderColor = ''; el.removeEventListener('input', handler); }, { once: true }); }
  });
}
</script>
</body>
</html>
