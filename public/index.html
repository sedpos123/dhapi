
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>中转导航 — 大模型 API 中转商家导航</title>
<style>
:root {
  --bg:      oklch(97% 0.012 80);
  --surface: oklch(99% 0.005 80);
  --fg:      oklch(20% 0.02 60);
  --muted:   oklch(48% 0.015 60);
  --border:  oklch(89% 0.012 80);
  --accent:  oklch(58% 0.16 35);
  --success: oklch(62% 0.17 145);
  --warn:    oklch(75% 0.16 85);
  --danger:  oklch(55% 0.2 25);
  --font-display: 'Iowan Old Style', 'Charter', Georgia, serif;
  --font-body:    -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono:    ui-monospace, 'JetBrains Mono', Menlo, monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); line-height: 1.5; }
.topnav {
  position: sticky; top: 0; z-index: 100;
  background: oklch(97% 0.012 80 / 0.92);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px; height: 56px;
  display: flex; align-items: center; gap: 24px;
}
.topnav .brand {
  font-family: var(--font-display); font-size: 20px; font-weight: 600;
  letter-spacing: -0.01em; color: var(--fg); white-space: nowrap; text-decoration: none;
}
.topnav .brand span { color: var(--accent); }
.topnav .nav-links { display: flex; gap: 20px; margin-inline-start: auto; }
.topnav .nav-links a {
  font-size: 13px; color: var(--muted); text-decoration: none;
  letter-spacing: 0.02em; transition: color .15s;
}
.topnav .nav-links a:hover { color: var(--fg); }
.hero {
  padding: 48px 24px 32px; text-align: center;
  border-bottom: 1px solid var(--border);
}
.hero h1 {
  font-family: var(--font-display); font-size: clamp(32px, 5vw, 48px);
  line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 12px;
}
.hero .subtitle {
  font-size: 16px; color: var(--muted); max-width: 520px; margin: 0 auto 28px;
  line-height: 1.6;
}
.search-box { max-width: 560px; margin: 0 auto; position: relative; }
.search-box input {
  width: 100%; padding: 12px 16px 12px 44px;
  font-size: 15px; font-family: var(--font-body);
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); color: var(--fg);
  outline: none; transition: border-color .15s;
}
.search-box input::placeholder { color: oklch(70% 0.01 60); }
.search-box input:focus { border-color: var(--accent); }
.search-box .icon {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  color: var(--muted); font-size: 18px; pointer-events: none;
}
.stats-row {
  display: flex; justify-content: center; gap: 40px; margin-top: 28px;
  font-size: 13px; color: var(--muted);
}
.stats-row .stat-item { text-align: center; }
.stats-row .num {
  font-family: var(--font-display); font-size: 24px; font-weight: 600;
  color: var(--fg); display: block; letter-spacing: -0.01em;
}
.layout {
  display: grid; grid-template-columns: 220px 1fr;
  max-width: 1280px; margin: 0 auto; min-height: 60vh;
}
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
}
.sidebar {
  border-inline-end: 1px solid var(--border);
  padding: 24px 20px; font-size: 13px;
}
.sidebar h3 {
  font-family: var(--font-mono); font-size: 11px; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--muted); margin-bottom: 12px; font-weight: 500;
}
.sidebar .filter-group { margin-bottom: 24px; }
.sidebar .filter-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 0; cursor: pointer; color: var(--fg);
  transition: color .15s; user-select: none;
}
.sidebar .filter-item:hover { color: var(--accent); }
.sidebar .filter-item.active { color: var(--accent); font-weight: 500; }
.sidebar .filter-item .count {
  margin-inline-start: auto; color: var(--muted);
  font-family: var(--font-mono); font-size: 12px;
}
.sidebar .filter-item input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; }
.main { padding: 24px; }
.toolbar {
  display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
}
.toolbar .result-count { font-size: 13px; color: var(--muted); margin-inline-end: auto; }
.toolbar .result-count strong { color: var(--fg); font-weight: 600; }
.sort-btn {
  font-size: 12px; padding: 5px 12px; border: 1px solid var(--border);
  border-radius: 6px; background: var(--surface); color: var(--muted);
  cursor: pointer; font-family: var(--font-body); transition: all .15s;
}
.sort-btn:hover, .sort-btn.active { border-color: var(--accent); color: var(--accent); }
.chip-row { display: none; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
@media (max-width: 860px) {
  .chip-row { display: flex; padding: 12px 16px; overflow-x: auto; }
  .main { padding: 16px; }
}
.chip {
  font-size: 12px; padding: 5px 14px; border: 1px solid var(--border);
  border-radius: 20px; background: var(--surface); color: var(--muted);
  cursor: pointer; transition: all .15s; white-space: nowrap;
}
.chip:hover, .chip.active { border-color: var(--accent); color: var(--accent); }
.card-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px;
}
@media (max-width: 480px) { .card-grid { grid-template-columns: 1fr; } }
.provider-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 20px; cursor: pointer;
  transition: border-color .15s, box-shadow .15s;
  display: flex; flex-direction: column; gap: 10px;
}
.provider-card:hover {
  border-color: oklch(70% 0.08 80);
  box-shadow: 0 2px 8px oklch(20% 0.02 60 / 0.06);
}
.card-top { display: flex; align-items: center; gap: 12px; }
.card-logo {
  width: 40px; height: 40px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-size: 18px; font-weight: 600;
  color: var(--surface); flex-shrink: 0;
}
.card-name { font-weight: 600; font-size: 15px; line-height: 1.3; }
.card-rating {
  display: flex; align-items: center; gap: 4px;
  font-family: var(--font-mono); font-size: 13px; color: var(--accent);
  margin-inline-start: auto; white-space: nowrap;
}
.card-rating .stars { letter-spacing: -1px; font-size: 12px; }
.card-desc { font-size: 13px; color: var(--muted); line-height: 1.5; }
.card-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  font-size: 11px; padding: 2px 8px; border-radius: 4px;
  font-family: var(--font-mono); letter-spacing: 0.01em;
  background: oklch(97% 0.01 80); color: var(--muted); border: 1px solid var(--border);
}
.tag.highlight { background: oklch(95% 0.04 35); color: var(--accent); border-color: oklch(85% 0.06 35); }
.card-bottom {
  display: flex; align-items: center; gap: 12px; margin-top: auto;
  padding-top: 10px; border-top: 1px solid var(--border); font-size: 12px;
}
.card-meta { color: var(--muted); }
.status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-inline-end: 4px; }
.status-dot.ok { background: var(--success); }
.status-dot.warn { background: var(--warn); }
.status-dot.down { background: var(--danger); }
.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: oklch(20% 0.02 60 / 0.4);
  align-items: flex-start; justify-content: center;
  padding: 48px 24px; overflow-y: auto;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface); border-radius: 12px;
  max-width: 640px; width: 100%; border: 1px solid var(--border);
  box-shadow: 0 8px 32px oklch(20% 0.02 60 / 0.12);
}
.modal-header { padding: 24px 24px 0; display: flex; align-items: center; gap: 16px; }
.modal-header .card-logo { width: 48px; height: 48px; font-size: 22px; border-radius: 10px; }
.modal-header h2 {
  font-family: var(--font-display); font-size: 24px; font-weight: 600;
  letter-spacing: -0.02em; line-height: 1.2;
}
.modal-close {
  margin-inline-start: auto; width: 32px; height: 32px;
  border: none; background: none; cursor: pointer;
  font-size: 20px; color: var(--muted); border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.modal-close:hover { background: oklch(95% 0.01 80); }
.modal-body { padding: 20px 24px 24px; }
.modal-section { margin-bottom: 20px; }
.modal-section:last-child { margin-bottom: 0; }
.modal-section h4 {
  font-family: var(--font-mono); font-size: 11px; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--muted); margin-bottom: 10px; font-weight: 500;
}
.modal-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.modal-stat { padding: 12px; background: var(--bg); border-radius: 6px; text-align: center; }
.modal-stat .val {
  font-family: var(--font-display); font-size: 24px; font-weight: 600;
  letter-spacing: -0.01em; display: block;
}
.modal-stat .label { font-size: 11px; color: var(--muted); margin-top: 2px; display: block; }
.modal-models { display: flex; flex-wrap: wrap; gap: 6px; }
.modal-features { list-style: none; }
.modal-features li {
  padding: 6px 0; border-bottom: 1px solid var(--border);
  font-size: 14px; display: flex; align-items: center; gap: 8px;
}
.modal-features li:last-child { border-bottom: none; }
.modal-features li::before { content: '✓'; color: var(--success); font-size: 13px; font-weight: 600; }
.modal-cta {
  display: inline-block; padding: 10px 24px;
  background: var(--accent); color: var(--surface);
  border-radius: 6px; text-decoration: none;
  font-size: 14px; font-weight: 500; transition: opacity .15s;
}
.modal-cta:hover { opacity: 0.88; }
.modal-rating-detail { display: flex; align-items: baseline; gap: 8px; }
.modal-rating-detail .big-score {
  font-family: var(--font-display); font-size: 36px; font-weight: 600;
  color: var(--accent); letter-spacing: -0.02em;
}
.modal-rating-detail .review-count { font-size: 13px; color: var(--muted); }
.modal-desc { font-size: 14px; color: var(--muted); line-height: 1.6; }
.site-footer {
  border-top: 1px solid var(--border); padding: 32px 24px; text-align: center;
  font-size: 12px; color: var(--muted); max-width: 1280px; margin: 48px auto 0;
}
.site-footer a { color: var(--accent); text-decoration: none; }
.site-footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<nav class="topnav">
  <a href="index.html" class="brand">中转<span>导航</span></a>
  <div class="nav-links">
    <a href="index.html">首页</a>
    <a href="#">对比</a>
    <a href="submit.html">提交商家</a>
  </div>
</nav>
<header class="hero">
  <h1>大模型 API 中转商家导航</h1>
  <p class="subtitle">收录国内可用的大模型中转服务商，按品牌、分类、稳定性筛选，找到最适合你的那一家</p>
  <div class="search-box">
    <span class="icon">⌕</span>
    <input type="text" id="searchInput" placeholder="搜索商家名称、品牌、标签…" />
  </div>
  <div class="stats-row">
    <div class="stat-item"><span class="num" id="statProviders">0</span>收录商家</div>
    <div class="stat-item"><span class="num" id="statBrands">0</span>覆盖品牌</div>
    <div class="stat-item"><span class="num" id="statReviews">0</span>用户评价</div>
  </div>
</header>
<div class="chip-row" id="chipRow"></div>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="filter-group">
      <h3>分类</h3>
      <div id="categoryFilters"></div>
    </div>
    <div class="filter-group">
      <h3>支持品牌</h3>
      <div id="brandFilters"></div>
    </div>
    <div class="filter-group">
      <h3>评分</h3>
      <div id="ratingFilters"></div>
    </div>
  </aside>
  <main class="main">
    <div class="toolbar">
      <div class="result-count" id="resultCount">共 <strong>0</strong> 家商家</div>
      <button class="sort-btn active" data-sort="rating">评分优先</button>
      <button class="sort-btn" data-sort="brands">品牌最多</button>
      <button class="sort-btn" data-sort="reviews">评价最多</button>
    </div>
    <div class="card-grid" id="cardGrid"></div>
  </main>
</div>
<footer class="site-footer">
  <p>数据仅供参考，请以商家官网为准。如有更新或纠错，<a href="submit.html">提交反馈</a>。</p>
</footer>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>
<script src="config.js"></script>
<script>
const API_BASE = window.API_BASE || '';
let providers = [];
let categories = ['全部'];
let brandOptions = [];
const ratingOptions = ['不限', '4.5+', '4.0+', '3.5+'];
let activeCategory = '全部', activeBrand = null, activeRating = 0, currentSort = 'rating', searchQuery = '';
function renderStars(r) { const f = Math.floor(r), h = r - f >= 0.3 ? 1 : 0; return '★'.repeat(f) + (h ? '½' : '') + '☆'.repeat(5 - f - h); }
function getFilteredProviders() {
  let list = [...providers];
  if (activeCategory !== '全部') list = list.filter(p => p.category === activeCategory);
  if (activeBrand) list = list.filter(p => p.brands.some(b => b.includes(activeBrand)));
  if (activeRating > 0) { const t = [0, 4.5, 4.0, 3.5]; list = list.filter(p => p.rating >= t[activeRating]); }
  if (searchQuery) { const q = searchQuery.toLowerCase(); list = list.filter(p => p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q) || p.brands.some(b => b.toLowerCase().includes(q)) || p.category.toLowerCase().includes(q)); }
  switch (currentSort) { case 'rating': list.sort((a, b) => b.rating - a.rating || b.reviews - a.reviews); break; case 'brands': list.sort((a, b) => b.brands.length - a.brands.length); break; case 'reviews': list.sort((a, b) => b.reviews - a.reviews); break; }
  return list;
}
function renderCards() {
  const grid = document.getElementById('cardGrid'), list = getFilteredProviders();
  document.getElementById('resultCount').innerHTML = `共 <strong>${list.length}</strong> 家商家`;
  grid.innerHTML = list.map(p => `<div class="provider-card" onclick="openModal('${p.id}')"><div class="card-top"><div class="card-logo" style="background:${p.color}">${p.name[0]}</div><div class="card-name">${p.name}</div><div class="card-rating"><span class="stars">${renderStars(p.rating)}</span>${p.rating}</div></div><div class="card-desc">${p.desc}</div><div class="card-tags">${p.brands.slice(0, 4).map(b => `<span class="tag">${b}</span>`).join('')}${p.brands.length > 4 ? `<span class="tag highlight">+${p.brands.length - 4}</span>` : ''}</div><div class="card-bottom"><span class="card-meta"><span class="status-dot ${p.status}"></span>${p.uptime !== '—' ? p.uptime + ' 可用' : '自建'}</span><span class="card-meta" style="margin-inline-start:auto">${p.reviews.toLocaleString()} 条评价</span></div></div>`).join('');
}
function renderSidebar() {
  document.getElementById('categoryFilters').innerHTML = categories.map(c => { const n = c === '全部' ? providers.length : providers.filter(p => p.category === c).length; return `<div class="filter-item ${activeCategory === c ? 'active' : ''}" onclick="setCategory('${c}')">${c} <span class="count">${n}</span></div>`; }).join('');
  document.getElementById('brandFilters').innerHTML = brandOptions.map(b => { const n = providers.filter(p => p.brands.includes(b)).length; return `<label class="filter-item ${activeBrand === b ? 'active' : ''}"><input type="checkbox" ${activeBrand === b ? 'checked' : ''} onchange="toggleBrand('${b}')" />${b} <span class="count">${n}</span></label>`; }).join('');
  document.getElementById('ratingFilters').innerHTML = ratingOptions.map((r, i) => `<div class="filter-item ${activeRating === i ? 'active' : ''}" onclick="setRating(${i})">${r}</div>`).join('');
  document.getElementById('chipRow').innerHTML = categories.map(c => `<span class="chip ${activeCategory === c ? 'active' : ''}" onclick="setCategory('${c}')">${c}</span>`).join('');
}
function openModal(id) {
  const p = providers.find(x => x.id === id); if (!p) return;
  document.getElementById('modalContent').innerHTML = `<div class="modal-header"><div class="card-logo" style="background:${p.color}">${p.name[0]}</div><h2>${p.name}</h2><button class="modal-close" onclick="closeModal()" aria-label="关闭">&times;</button></div><div class="modal-body"><div class="modal-section"><div class="modal-rating-detail"><span class="big-score">${p.rating}</span><span style="color:var(--accent);font-size:14px;">${renderStars(p.rating)}</span><span class="review-count">${p.reviews.toLocaleString()} 条评价</span></div></div><div class="modal-section"><p class="modal-desc">${p.desc}</p></div><div class="modal-section"><h4>关键数据</h4><div class="modal-stats"><div class="modal-stat"><span class="val">${p.brands.length}</span><span class="label">支持品牌</span></div><div class="modal-stat"><span class="val">${p.uptime}</span><span class="label">可用率</span></div><div class="modal-stat"><span class="val">${p.speed}</span><span class="label">首 token 延迟</span></div></div></div><div class="modal-section"><h4>支持品牌</h4><div class="modal-models">${p.brands.map(b => `<span class="tag">${b}</span>`).join('')}</div></div><div class="modal-section"><h4>核心特性</h4><ul class="modal-features">${p.features.map(f => `<li>${f}</li>`).join('')}</ul></div><div class="modal-section"><a href="${p.url}" class="modal-cta">访问官网</a></div></div>`;
  document.getElementById('modalOverlay').classList.add('open'); document.body.style.overflow = 'hidden';
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); document.body.style.overflow = ''; }
function setCategory(c) { activeCategory = c; renderSidebar(); renderCards(); }
function toggleBrand(b) { activeBrand = activeBrand === b ? null : b; renderSidebar(); renderCards(); }
function setRating(i) { activeRating = i; renderSidebar(); renderCards(); }
document.querySelectorAll('.sort-btn').forEach(btn => { btn.addEventListener('click', () => { document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); currentSort = btn.dataset.sort; renderCards(); }); });
document.getElementById('searchInput').addEventListener('input', e => { searchQuery = e.target.value.trim(); renderCards(); });
document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
async function loadData() {
  try {
    const [pRes, bRes, cRes] = await Promise.all([
      fetch(API_BASE + '/api/providers').then(r => r.json()),
      fetch(API_BASE + '/api/brands').then(r => r.json()),
      fetch(API_BASE + '/api/categories').then(r => r.json())
    ]);
    providers = pRes.providers || [];
    brandOptions = (bRes.brands || []).map(b => b.name);
    categories = ['全部', ...(cRes.categories || []).map(c => c.name)];
  } catch (e) {
    document.getElementById('cardGrid').innerHTML = '<div style="text-align:center;padding:48px;color:var(--danger);">数据加载失败，请刷新页面重试</div>';
  }
}
(async function init() { await loadData(); const allBrands = new Set(); providers.forEach(p => p.brands.forEach(b => allBrands.add(b))); document.getElementById('statProviders').textContent = providers.length; document.getElementById('statBrands').textContent = allBrands.size; document.getElementById('statReviews').textContent = providers.reduce((s, p) => s + p.reviews, 0).toLocaleString(); renderSidebar(); renderCards(); })();
</script>
</body>
</html>
